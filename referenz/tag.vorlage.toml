# Vorlage fuer $FBT_DATEN/tage/JJJJ-MM-TT.toml
#
# ACHTUNG TOML: Alle Schluessel auf oberster Ebene muessen VOR der ersten
# [[mahlzeit]]-Tabelle stehen. Steht beobachtungen weiter unten, gehoert es
# plotzlich zur letzten Mahlzeit.
#
# Erlaubt sind auf oberster Ebene genau: datum, ziel_kcal, beobachtungen,
# mahlzeit. Alles andere lehnt der Loader ab — ein Tippfehler wie
# "mahlzeiten" wuerde sonst als "nichts gegessen" gelesen.

datum = 2026-01-01
# ziel_kcal gibt die Aerztin vor — genau wie kcal_taeglich in der
# profil.vorlage.toml. Solange die Zeile fehlt oder auskommentiert ist,
# rechnet die Bilanz die Tagessumme, beurteilt sie aber nicht. Trage hier
# keinen Platzhalter und keine selbst hergeleitete Zahl ein: dieser Wert
# wandert in den Arztbericht und saehe dort wie eine Vorgabe aus.
# ziel_kcal = 2000
beobachtungen = """
Freitext: Stimmung, was geholfen hat, was eskaliert ist, Auffaelligkeiten.
"""

[[mahlzeit]]
zeit = "07:30"
name = "Fruehstueck"

  [[mahlzeit.gericht]]
  titel = "Power-Porridge"                              # Bitte keine Kalorienangaben im Titel! (wird am Tisch gelesen)
  quelle = "kochbuch:power-porridge-schnelle-variante"  # oder "cookidoo:r16687" oder "frei"
  kcal_geplant = 800
  anteil_gegessen = 1.0                                 # 0.0 bis 1.0, Schaetzung der Eltern
